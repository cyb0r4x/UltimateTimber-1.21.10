name: Build and attach release JAR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and upload
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - name: Set up Java 23 and Maven cache
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '23'
          cache: maven
      - name: Build and test
        run: mvn -B clean verify
      - name: Upload the plugin JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" UltimateTimber-Plugin/target/UltimateTimber-5.1.1-mc1.21.10.jar --repo "$GITHUB_REPOSITORY" --clobber
